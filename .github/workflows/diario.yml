name: Automatizacion Diaria Hyundai HTA

on:
  schedule:
    # Se ejecuta de Lunes a Viernes a las 11:00 UTC (8:00 AM hora Paraguay)
    - cron: '0 11 * * 1-5'
  workflow_dispatch: # Permite probarlo manualmente cuando quieras

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Playwright y Librerías
        run: |
          pip install playwright google-genai pandas openpyxl
          playwright install --with-deps chromium

      - name: Determinar Grupo según el Día
        run: |
          # 1=Lunes, 2=Martes, 3=Miércoles, 4=Jueves, 5=Viernes
          DAY_NUM=$(date +%u)
          echo "GRUPO_NUM=$DAY_NUM" >> $GITHUB_ENV
          echo "Hoy es día $DAY_NUM de la semana. Se procesará el Grupo $DAY_NUM."

      - name: Ejecutar Script de Automatización
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python ejecutargrupo.py $GRUPO_NUM
