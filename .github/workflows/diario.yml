name: Automatizacion Diaria Hyundai HTA

on:
  schedule:
    # Se ejecuta de Lunes a Viernes a las 11:00 UTC (8:00 AM hora Paraguay)
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
    inputs:
      grupo:
        description: 'Número de grupo a ejecutar (1 al 5)'
        required: false
        default: '1'

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Librerías y Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright google-generativeai google-genai pandas openpyxl firebase-admin
          playwright install --with-deps chromium

      - name: Ejecutar Script de Automatización
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Ejecución manual detectada para el Grupo ${{ github.event.inputs.grupo }}"
            python ejecutargrupo.py ${{ github.event.inputs.grupo }}
          else
            DAY_NUM=$(date +%u)
            echo "Ejecución automática por Cron para el Día $DAY_NUM"
            python ejecutargrupo.py $DAY_NUM
          fi
