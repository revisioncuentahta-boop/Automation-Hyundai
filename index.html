<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyundai Monitor App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Librerías estables v8 de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        body {
            background: linear-gradient(rgba(15, 23, 42, 0.88), rgba(15, 23, 42, 0.95)), 
                        url('https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?q=80&w=1200&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="text-white min-h-screen p-4 font-sans">
    <div class="max-w-md mx-auto space-y-5">
        
        <!-- Encabezado -->
        <div class="flex justify-between items-center border-b border-gray-700/60 pb-3 backdrop-blur-sm">
            <div>
                <h1 class="text-xl font-black tracking-wider text-blue-400 uppercase flex items-center gap-1.5">
                    🏎️ Hyundai Monitor
                </h1>
                <p class="text-xs text-gray-400 font-medium">Panel de Control WRC / HTA</p>
            </div>
            <span id="status-badge" class="px-3 py-1 rounded-full text-xs font-bold bg-gray-800/80 text-gray-400 border border-gray-700">
                Cargando...
            </span>
        </div>

        <!-- Botón Maestro de Suspensión General -->
        <div id="pause-banner" class="bg-gray-800/90 backdrop-blur p-3 rounded-xl border border-gray-700/80 flex justify-between items-center shadow-lg">
            <div>
                <p class="text-[10px] text-gray-400 uppercase font-black tracking-wider">Estado del Sistema</p>
                <p id="pause-status-text" class="text-xs font-bold text-green-400">🟢 Automatización Activa</p>
            </div>
            <button id="btn-toggle-pause" onclick="togglePausarSistema()" 
                    class="bg-yellow-600/20 hover:bg-yellow-600/40 text-yellow-300 border border-yellow-500/40 px-3 py-1.5 rounded-lg text-xs font-bold transition">
                ⏸️ Suspender
            </button>
        </div>

        <!-- Sección de Ejecución Manual por Grupo/Día -->
        <div class="bg-gray-800/90 backdrop-blur p-3.5 rounded-xl border border-gray-700/80 shadow-lg space-y-2">
            <p class="text-[10px] text-blue-400 font-black uppercase tracking-wider">⚡ Iniciar Ejecución Manual por Día</p>
            <div class="grid grid-cols-5 gap-1.5 text-xs">
                <button onclick="ejecutarGrupoManual('1', 'Lunes')" class="bg-blue-600/30 hover:bg-blue-600/50 border border-blue-500/50 text-blue-200 py-2 rounded-lg font-bold text-center">
                    Lun
                </button>
                <button onclick="ejecutarGrupoManual('2', 'Martes')" class="bg-blue-600/30 hover:bg-blue-600/50 border border-blue-500/50 text-blue-200 py-2 rounded-lg font-bold text-center">
                    Mar
                </button>
                <button onclick="ejecutarGrupoManual('3', 'Miércoles')" class="bg-blue-600/30 hover:bg-blue-600/50 border border-blue-500/50 text-blue-200 py-2 rounded-lg font-bold text-center">
                    Mié
                </button>
                <button onclick="ejecutarGrupoManual('4', 'Jueves')" class="bg-blue-600/30 hover:bg-blue-600/50 border border-blue-500/50 text-blue-200 py-2 rounded-lg font-bold text-center">
                    Jue
                </button>
                <button onclick="ejecutarGrupoManual('5', 'Viernes')" class="bg-blue-600/30 hover:bg-blue-600/50 border border-blue-500/50 text-blue-200 py-2 rounded-lg font-bold text-center">
                    Vie
                </button>
            </div>
        </div>

        <!-- Estado de Ejecución en Tiempo Real -->
        <div class="bg-gray-800/90 backdrop-blur p-4 rounded-xl border border-gray-700/80 shadow-lg space-y-3">
            <h2 class="text-xs font-black text-gray-300 uppercase tracking-wider">Estado en Tiempo Real</h2>
            <div id="live-container" class="space-y-2">
                <div class="flex justify-between text-sm">
                    <span class="text-gray-400">Usuario actual:</span>
                    <span id="usuario-actual" class="font-mono text-blue-300 font-bold">---</span>
                </div>
                <div class="flex justify-between text-sm">
                    <span class="text-gray-400">Progreso:</span>
                    <span id="progreso-texto" class="font-bold">0/0</span>
                </div>
                <div class="flex justify-between text-sm">
                    <span class="text-gray-400">Fallos detectados:</span>
                    <span id="fallos-count" class="text-red-400 font-bold">0</span>
                </div>
            </div>
        </div>

        <!-- Sección de Administración de Usuarios -->
        <div class="space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="text-xs font-black text-gray-300 uppercase tracking-wider">Técnicos / Usuarios</h2>
                <button onclick="toggleModal()" class="bg-blue-600 hover:bg-blue-500 px-3 py-1.5 rounded-lg text-xs font-bold shadow-md">
                    + Nuevo Usuario
                </button>
            </div>

            <!-- Buscador y Filtros -->
            <div class="space-y-2">
                <input type="text" id="searchInput" onkeyup="filtrarUsuarios()" placeholder="🔍 Buscar por correo..." 
                       class="w-full bg-gray-800/90 border border-gray-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
                
                <div class="flex space-x-2 text-xs">
                    <button onclick="setFiltro('todos')" id="btn-filtro-todos" class="px-3 py-1 rounded-lg bg-blue-600 font-bold">Todos</button>
                    <button onclick="setFiltro('activos')" id="btn-filtro-activos" class="px-3 py-1 rounded-lg bg-gray-800/90 text-gray-400">Activos</button>
                    <button onclick="setFiltro('inactivos')" id="btn-filtro-inactivos" class="px-3 py-1 rounded-lg bg-gray-800/90 text-gray-400">Inactivos</button>
                </div>
            </div>

            <!-- Lista de Usuarios -->
            <div id="users-list
